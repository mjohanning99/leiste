<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
	<linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
		<stop offset="0" stop-color="#f7cfa8"/><stop offset="0.45" stop-color="#c9a3d8"/><stop offset="1" stop-color="#6f8fd6"/>
	</linearGradient>
	<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
		<stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.52"/>
	</linearGradient>
	<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
		<stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0.2"/>
		<stop offset="0.7" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
	</linearGradient>
	<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a1f4a" flood-opacity="0.28"/></filter>
	<clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
</defs>
<g clip-path="url(#body)">
	<rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
	<circle cx="710" cy="320" r="90" fill="#fff4dc" opacity="0.55"/>
	<!-- two windows -->
	<g filter="url(#soft)">
		<rect x="190" y="250" width="420" height="330" rx="34" fill="#fbfbfd"/>
		<rect x="190" y="250" width="420" height="58" rx="34" fill="#ececf1"/>
		<rect x="190" y="280" width="420" height="28" fill="#ececf1"/>
		<circle cx="230" cy="280" r="11" fill="#ff5f57"/><circle cx="263" cy="280" r="11" fill="#febc2e"/><circle cx="296" cy="280" r="11" fill="#28c840"/>
		<rect x="400" y="360" width="420" height="300" rx="34" fill="#ffffff"/>
		<rect x="400" y="360" width="420" height="58" rx="34" fill="#efeff4"/>
		<rect x="400" y="390" width="420" height="28" fill="#efeff4"/>
		<circle cx="440" cy="390" r="11" fill="#ff5f57"/><circle cx="473" cy="390" r="11" fill="#febc2e"/><circle cx="506" cy="390" r="11" fill="#28c840"/>
		<rect x="440" y="450" width="250" height="18" rx="9" fill="#d9d9e3"/>
		<rect x="440" y="486" width="320" height="18" rx="9" fill="#e4e4ec"/>
		<rect x="440" y="522" width="200" height="18" rx="9" fill="#e4e4ec"/>
	</g>
	<!-- the bar: glass with a bright rim, three window buttons, the first raised -->
	<g filter="url(#soft)">
		<rect x="160" y="700" width="704" height="120" rx="60.0" fill="url(#glass)"/>
	</g>
	<rect x="161" y="701" width="702" height="118" rx="59.0" fill="none" stroke="url(#rim)" stroke-width="3"/>
	<rect x="190" y="722" width="230" height="76" rx="38.0" fill="#ffffff" stroke="#00000014" stroke-width="2"/>
	<rect x="212" y="742" width="36" height="36" rx="9" fill="#6f8fd6"/>
	<rect x="262" y="752" width="130" height="16" rx="8" fill="#3a3550" opacity="0.75"/>
	<rect x="442" y="742" width="36" height="36" rx="9" fill="#e59a6b"/>
	<rect x="492" y="752" width="100" height="16" rx="8" fill="#3a3550" opacity="0.4"/>
	<rect x="635" y="740" width="2" height="40" fill="#3a3550" opacity="0.18"/>
	<rect x="665" y="742" width="36" height="36" rx="9" fill="#9a7ad0"/>
	<rect x="715" y="752" width="70" height="16" rx="8" fill="#3a3550" opacity="0.4"/>
</g>
</svg>
